<h2 id="server_tasks">1. Was machen die Server?</h2>

<ul>
    <li><strong>Vermitteln</strong> Download-, Upload- und Suchanfragen der Clients untereinander</li>
    <li><strong>Verwalten</strong> gemeinsam den <code>Index</code> des gesamten Netzwerkes (<code>Hashtable</code>)</li>
    <li><strong>Verwalten</strong> eine <code>Whitelist</code> der erlaubten Cores</li>
</ul>

<div class="notification is-small is-danger is-light">
    <i class="fas fa-fw fa-exclamation"></i> Die Server stellen <strong>keine</strong> Dateien zur Verfügung.
</div>
