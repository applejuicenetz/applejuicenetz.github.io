<h3 id="welche_java_version">3.1 Benötigt der Server Java?</h3>

<p>
    Nein. Ab Version <code>0.95.x</code> ist der Server in Go geschrieben und benötigt keine Java-Laufzeit.
    Verwende das passende Paket für dein Betriebssystem und deine Prozessorarchitektur.
    Nur die ältere Java-Serverreihe <code>0.85.x</code> benötigt Java 25.
</p>
