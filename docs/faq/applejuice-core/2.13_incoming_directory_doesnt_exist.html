<h3 id="incoming_directory_doesnt_exist">2.13. incoming directory does not exists</h3>

<ul>
    <li><strong>Meldung:</strong> <code>incoming directory does not exists</code></li>
    <li><strong>Ursache:</strong> Der eingestellte Incoming-Ordner konnte nicht angelegt werden</li>
    <li><strong>Lösung:</strong> Ändere den <code>Incoming</code>-Ordner oder erstelle ihn manuell</li>
</ul>
