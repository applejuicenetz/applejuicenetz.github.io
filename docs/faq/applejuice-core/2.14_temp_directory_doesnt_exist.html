<h3 id="temp_directory_doesnt_exist">2.14. temporary directory does not exists</h3>

<ul>
    <li><strong>Meldung:</strong> <code>temporary directory does not exists</code></li>
    <li><strong>Ursache:</strong> Der eingestellte Temp-Ordner konnte nicht angelegt werden</li>
    <li><strong>Lösung:</strong> Ändere den <code>Temp</code>-Ordner oder erstelle ihn manuell</li>
</ul>
