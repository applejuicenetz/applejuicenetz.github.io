<h3 id="failure_incorrect_link">2.16. failure: incorrect link</h3>

<ul>
    <li><strong>Meldung:</strong> <code>failure: incorrect link</code></li>
    <li><strong>Problem:</strong> Der <code>ajfsp</code>-Link wird nicht vom Core übernommen</li>
    <li><strong>Ursache:</strong> Der Link ist defekt</li>
    <li><strong>Lösung:</strong> Probiere als Gegentest einen anderen Link</li>
</ul>
