<h2 id="server_lampen">18. Was bedeuten die Lampen neben den Servern?</h2>

<ul>
    <li>Gelb = Server ist online</li>
    <li>Rot = Dein Client versucht sich gerade mit diesem Server zu verbinden</li>
    <li>Grün = Du bist mit diesem Server verbunden</li>
    <li>Grau = Server ist down beziehungsweise für dich nicht erreichbar</li>
</ul>
