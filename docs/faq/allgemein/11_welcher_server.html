<h2 id="welcher_server">11. Welche Server sind gut?</h2>

<p>
    Es gibt keine guten oder schlechten Server. Alle Server im appleJuice-Netzwerk haben dieselben Informationen,
    denn sie fragen sich untereinander gegenseitig nach Quellen ab.
    Du kannst also mit jedem beliebigen Server verbunden sein und findest trotzdem alle Quellen.
</p>
