<h2 id="wofuer_ist_catch_ajfsp">1. Wofür ist catch_ajfsp?</h2>

<p>
    <a href="/downloads/applejuice-catch-ajfsp/">catch_ajfsp</a> übergibt <code>ajfsp://</code>- und <code>web+ajfsp://</code>-Links direkt an einen Core, ohne dass eine GUI geöffnet sein muss.
    Der Core läuft lokal oder auf einem anderen Rechner.
</p>
