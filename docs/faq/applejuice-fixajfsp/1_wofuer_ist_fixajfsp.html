<h2 id="wofuer_ist_fixajfsp">1. Wofür ist fixajfsp?</h2>

<p>
    <a href="/downloads/applejuice-fixajfsp/">fixajfsp</a> verknüpft <code>ajfsp://</code>-Links, <code>web+ajfsp://</code>-Links und <code>.ajl</code>-Dateien mit deiner GUI.
    Ein Klick auf einen Link im Browser öffnet dann die GUI und übergibt den Link an den Core.
</p>
