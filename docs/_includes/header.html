<nav class="navbar is-primary {% if site.fixed_navbar %} is-fixed-{{ site.fixed_navbar }} {% endif %}" x-data="{ openNav: false }">
    <div class="container">
        <div class="navbar-brand">
            <a href="{{ site.baseurl }}/" class="navbar-item {% if page.url == '/' %}is-active{% endif %}">
                {{ site.title }}
            </a>
            <a role="button" class="navbar-burger burger" aria-label="menu" aria-expanded="false" data-target="navMenu" :class="{ 'is-active': openNav }" x-on:click="openNav = !openNav">
                <span aria-hidden="true"></span>
                <span aria-hidden="true"></span>
                <span aria-hidden="true"></span>
            </a>
        </div>
        <div class="navbar-menu" id="navMenu" :class="{ 'is-active': openNav }">
            <div class="navbar-start">
                {% if site.data.navigation %}
                {% for item in site.data.navigation %}
                {% if item.dropdown %}
                <div class="navbar-item has-dropdown is-hoverable">
                    <a href="{{ item.link | relative_url }}" class="navbar-link {% if page.url contains item.link %}is-active{% endif %}">{{ item.name }}</a>
                    <div class="navbar-dropdown">
                        {% for subitem in item.dropdown %}
                        <a href="{{ subitem.link | relative_url }}" class="navbar-item {% if page.url contains subitem.link %}is-active{% endif %}">{{ subitem.name }}</a>
                        {% endfor %}
                    </div>
                </div>
                {% else %}
                <a href="{{ item.link | relative_url }}" class="navbar-item {% if page.url contains item.link %}is-active{% endif %}">{{ item.name }}</a>
                {% endif %}
                {% endfor %}
                {% endif %}
            </div>

            <div class="navbar-item">
                <form method="get" action="https://duckduckgo.com/" class="field has-addons navbar-search">
                    <input type="hidden" name="sites" value="https://{{ site.github_username }}.github.io/">
                    <div class="control">
                        <input class="input" type="text" name="q" placeholder="Suche mit DuckDuckGo" minlength="3" required>
                    </div>
                    <div class="control">
                        <button class="button is-info" type="submit" aria-label="Suchen">
                            <span class="icon"><i class="fas fa-search" aria-hidden="true"></i></span>
                        </button>
                    </div>
                </form>
            </div>

            <div class="navbar-end">
                <div id="theme-picker" class="navbar-item theme-picker">
                    <button id="theme-toggle" class="theme-toggle" type="button" aria-label="Darstellung wählen" title="Darstellung wählen" aria-haspopup="menu" aria-expanded="false" aria-controls="theme-menu">
                        <span class="icon"><i class="fas fa-desktop" aria-hidden="true"></i></span>
                    </button>
                    <div id="theme-menu" class="theme-menu" role="menu" aria-label="Darstellung">
                        <button class="theme-option" type="button" role="menuitemradio" data-theme-mode="light" aria-checked="false">
                            <span class="icon"><i class="fas fa-sun" aria-hidden="true"></i></span>
                            <span>Hell</span>
                        </button>
                        <button class="theme-option" type="button" role="menuitemradio" data-theme-mode="dark" aria-checked="false">
                            <span class="icon"><i class="fas fa-moon" aria-hidden="true"></i></span>
                            <span>Dunkel</span>
                        </button>
                        <button class="theme-option" type="button" role="menuitemradio" data-theme-mode="system" aria-checked="true">
                            <span class="icon"><i class="fas fa-desktop" aria-hidden="true"></i></span>
                            <span>System</span>
                        </button>
                    </div>
                </div>
                <a class="navbar-item" href="https://github.com/{{ site.github_username }}" target="_blank" rel="noopener noreferrer">
                    <span class="icon"><i class="fab fa-github" aria-hidden="true"></i></span>
                    <span>GitHub</span>
                </a>
            </div>
        </div>
    </div>
</nav>
