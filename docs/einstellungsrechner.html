---
layout: page
title: Einstellungsrechner
description: Berechne die optimalen Einstellungen für den appleJuice Client
---

<form id="wizard">
    <div class="columns is-centered">
        <div class="column is-two-thirds-tablet is-half-desktop">
            <div class="box">
                <p class="has-text-centered mb-4">
                    Wähle deine Internetverbindung aus oder gib deine Bandbreite selbst ein.
                </p>
                <dl class="inline-flex">
                    <dt>
                        <label for="preset">Internetverbindung</label>
                    </dt>
                    <dd>
                        <select id="preset" class="input">
                            <option class="has-text-centered" value="custom" autofocus selected>-- custom --</option>
                        </select>
                    </dd>

                    <dt>
                        <label for="download">Download in kbit/s</label>
                    </dt>
                    <dd>
                        <input type="number" id="download" class="input has-text-right" step="128"/>
                    </dd>

                    <dt>
                        <label for="upload">Upload in kbit/s</label>
                    </dt>
                    <dd>
                        <input type="number" id="upload" class="input has-text-right" step="128"/>
                    </dd>
                </dl>

                <hr/>

                <p class="has-text-centered mb-4">
                    <strong>Im Client eintragen</strong>
                </p>
                <dl class="inline-flex">
                    <dt>
                        <label for="download_calculated">Download in KB/s</label>
                    </dt>
                    <dd>
                        <input type="number" id="download_calculated" class="input has-text-right" readonly/>
                    </dd>

                    <dt>
                        <label for="upload_calculated">Upload in KB/s</label>
                    </dt>
                    <dd>
                        <input type="number" id="upload_calculated" class="input has-text-right" readonly/>
                    </dd>
                </dl>
            </div>
            <div class="notification is-info is-light">
                Hast du keinen Download, setze das Download-Limit im Client auf <code>0</code>.
            </div>
        </div>
    </div>
</form>
<script src="/assets/js/config-wizard.js"></script>
